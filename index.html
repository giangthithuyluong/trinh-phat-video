<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtuba</title>
    <style>
        :root {
            --nav-height: 60px;
            --btn-width: 40px;
            --btn-height: 40px;
            --font-size: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Robonto', sans-serif;
            font-size: var(--font-size);
        }
    </style>

    <link rel="stylesheet" href="./acess/css/nav.css">
    <link rel="stylesheet" href="./acess/css/video.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="list_layout">
        <nav>
            <button type="button" id="more"></button>
            <a href="" id="logo" title="Trang chu Youtuba">
                <img src="./acess/image/logo.png" alt="Trang chu Youtuba">
            </a>
            <div>
                <button type="button" id="search" title="Tim kiem"></button>
                <div class="search_form">
                    <input type="search" name="search_text" id="search_text" placeholder="Tim kiem">
                    <button type="button" id="btn_search"></button>
                </div>
                <button type="button" id="mic" title="Tim kiem bang giong noi"></button>
            </div>
            <button type="button" id="setting" title="Cai dat"></button>
            <button type="button" id="login"></button>
        </nav>
        <div class="video">
            <video src="" id="current_video"></video>
            <div class="video_control">
                <input type="range" name="progress" id="progress" min="0" max="100" value="0">
                <div class="button_control">
                    <button type="button" id="prev" title="Truoc"></button>
                    <button type="button" id="control"></button>
                    <button type="button" id="next" title="Sau"></button>
                    <div>
                        <div class="volume"><input type="range" name="volume_value" id="volume_value" min="0" max="100" value="0"></div>
                        <p id="time">
                            <span id="current_time"></span>
                            <span id="duration"></span>
                        </p>
                    </div>
                    <button type="button" id="video_cc" title="Phu de"></button>
                    <button type="button" id="video_setting" title="Cai dat"></button>
                    <button type="button" id="video_to_small" title="Mo hinh trong hinh"></button>
                    <button type="button" id="video_mode" title="Che do rap phim"></button>
                    <button type="button" id="video_screen_mode" class="video_fullscreen" title="Toan man hinh"></button>
                </div>
            </div>
        </div>
        <div class="video_info">
            
        </div>
        <div class="list">
            <div class="list_header">
                <div class="list_info">
                    <h3 class="title"></h3>
                    <p class="author"></p>
                </div>
                <button type="button"></button>
                <div class="list_description">
                    <div class="list_content">

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./acess/js/video.js"></script>
</html>
